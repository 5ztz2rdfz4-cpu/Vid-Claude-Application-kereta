<!doctype html>
<html lang="ms">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root { --ground: #000; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; }
      .frame { position: absolute; inset: 0; z-index: 1; }
      .frame.broll { z-index: 5; }
      .frame video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
      #scrim { position: absolute; inset: 0; z-index: 10; pointer-events: none;
        background: linear-gradient(180deg, rgba(0,0,0,.50) 0%, rgba(0,0,0,0) 34%, rgba(0,0,0,0) 52%, rgba(0,0,0,.45) 78%, rgba(0,0,0,.25) 100%); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="28.60" data-width="1080" data-height="1920" data-fps="30">
      <div class="frame" id="seg-offer-wrap">
        <video id="seg-offer" class="clip" src="assets/take5090.mp4" data-start="0.00" data-duration="7.60" data-media-start="8.15" data-track-index="0" data-has-audio="true" data-volume="1" data-fade-in="0.03" data-fade-out="0.03" playsinline style="z-index:1"></video>
      </div>
      <div class="frame" id="seg-specs-wrap">
        <video id="seg-specs" class="clip" src="assets/take5089.mp4" data-start="7.60" data-duration="13.03" data-media-start="0.12" data-track-index="0" data-has-audio="true" data-volume="1" data-fade-in="0.03" data-fade-out="0.03" playsinline style="z-index:1"></video>
      </div>
      <div class="frame" id="seg-cta-wrap">
        <video id="seg-cta" class="clip" src="assets/take5090.mp4" data-start="20.63" data-duration="7.97" data-media-start="15.98" data-track-index="0" data-has-audio="true" data-volume="1" data-fade-in="0.03" data-fade-out="0.03" playsinline style="z-index:1"></video>
      </div>
      <div class="frame broll" id="br-front-wrap">
        <video id="br-front" class="clip" src="assets/broll_front.mp4" data-start="0.00" data-duration="3.40" data-media-start="0.30" data-track-index="1" muted playsinline></video>
      </div>
      <div class="frame broll" id="br-badge-wrap">
        <video id="br-badge" class="clip" src="assets/broll_badge.mp4" data-start="10.80" data-duration="3.50" data-media-start="0.30" data-track-index="1" muted playsinline></video>
      </div>
      <div class="frame broll" id="br-hood-wrap">
        <video id="br-hood" class="clip" src="assets/broll_hood.mp4" data-start="14.30" data-duration="3.60" data-media-start="0.20" data-track-index="1" muted playsinline></video>
      </div>
      <div id="scrim" data-layout-ignore></div>
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0.00" data-duration="3.40" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:20"></div>
      <div id="model" data-composition-id="model" data-composition-src="compositions/model.html" data-start="7.60" data-duration="3.20" data-track-index="4" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:21"></div>
      <div id="specs" data-composition-id="specs" data-composition-src="compositions/specs.html" data-start="12.00" data-duration="5.90" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:22"></div>
      <div id="rahmah" data-composition-id="rahmah" data-composition-src="compositions/rahmah.html" data-start="19.00" data-duration="2.00" data-track-index="6" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:23"></div>
      <div id="cta" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="22.30" data-duration="6.30" data-track-index="7" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:24"></div>
      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="28.60" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:40"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Punch-ins on the talking head (origin on the speaker's face) to hide jump cuts.
      const P = (sel, t, s, ox, oy) => tl.set(sel, { scale: s, transformOrigin: ox + "px " + oy + "px" }, t);
      P("#seg-offer-wrap", 0, 1.18, 760, 640);
      P("#seg-offer-wrap", 5.60, 1.36, 760, 640);
      P("#seg-specs-wrap", 7.60, 1.0, 640, 700);
      P("#seg-specs-wrap", 17.90, 1.28, 660, 660);
      P("#seg-cta-wrap", 20.63, 1.12, 700, 640);
      P("#seg-cta-wrap", 23.50, 1.26, 700, 380);
      // Slow push on each B-roll insert.
      tl.fromTo("#br-front-wrap", { scale: 1.0 }, { scale: 1.10, duration: 3.40, ease: "none", transformOrigin: "50% 45%" }, 0);
      tl.fromTo("#br-badge-wrap", { scale: 1.12, x: 0 }, { scale: 1.0, x: 0, duration: 3.50, ease: "none", transformOrigin: "50% 40%" }, 10.80);
      tl.fromTo("#br-hood-wrap", { scale: 1.0, y: 0 }, { scale: 1.08, y: -30, duration: 3.60, ease: "none", transformOrigin: "50% 50%" }, 14.30);
      // Quick dip on the B-roll exits so the cut back reads as intended.
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
