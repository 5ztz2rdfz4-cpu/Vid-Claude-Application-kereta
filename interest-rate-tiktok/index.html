<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <link rel="stylesheet" href="assets/ui.css" />
    <style>
      @font-face {
        font-family: "LG Display";
        src: url("assets/fonts/LeagueGothic.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: block;
      }
      :root {
        --ground: #0b0d12;
        --panel: #141821;
        --yellow: #ffd21e;
        --red: #ff3b3f;
        --green: #22c55e;
        --ink: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        font-family: "Montserrat", sans-serif;
      }
      /* dark studio ground, visible whenever the speaker shrinks to the PIP */
      #bg {
        position: absolute;
        inset: 0;
        z-index: 1;
        background: radial-gradient(120% 70% at 50% 0%, #1b2030 0%, #0b0d12 55%, #07080b 100%);
      }
      #bg-glow {
        position: absolute;
        left: -200px;
        top: -260px;
        width: 900px;
        height: 900px;
        border-radius: 50%;
        background: radial-gradient(closest-side, rgba(255, 210, 30, 0.16), rgba(255, 210, 30, 0));
      }
      #bg-grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
        background-size: 60px 60px;
      }
      #camwrap {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        z-index: 2;
      }
      #camclip {
        position: absolute;
        inset: 0;
        clip-path: inset(0px 0px 0px 0px round 0px);
      }
      #talk {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        object-fit: cover;
      }
      #pipframe {
        position: absolute;
        left: 0;
        top: 0;
        width: 1080px;
        height: 1920px;
        z-index: 3;
        pointer-events: none;
      }
      #pipring {
        position: absolute;
        left: 362px;
        top: 900px;
        width: 356px;
        height: 380px;
        border: 6px solid var(--yellow);
        border-radius: 40px;
        box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
        opacity: 0;
      }
      .scene {
        z-index: 5;
      }
      #captions {
        z-index: 8;
      }
      #chrome {
        z-index: 9;
      }
      #endcard {
        z-index: 10;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="61"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg" class="clip" data-start="0" data-duration="61" data-track-index="0">
        <div id="bg-grid"></div>
        <div id="bg-glow"></div>
      </div>

      <div id="camwrap">
        <div id="camclip">
          <video
            id="talk"
            class="clip"
            src="assets/video/talk.mp4"
            data-start="0"
            data-duration="57.93"
            data-track-index="1"
            data-has-audio="true"
            data-volume="1"
            playsinline
          ></video>
        </div>
      </div>

      <div id="pipframe" class="clip" data-start="0" data-duration="57.93" data-track-index="2">
        <div id="pipring"></div>
      </div>

      <!-- graphics scenes, back to back on one lane -->
      <div id="hook" class="scene" data-composition-id="hook" data-composition-src="compositions/hook.html" data-start="0" data-duration="4.93" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="spec" class="scene" data-composition-id="spec" data-composition-src="compositions/spec.html" data-start="4.93" data-duration="3.67" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="compare" class="scene" data-composition-id="compare" data-composition-src="compositions/compare.html" data-start="8.6" data-duration="6.3" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="who" class="scene" data-composition-id="who" data-composition-src="compositions/who.html" data-start="14.9" data-duration="7.3" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="bank" class="scene" data-composition-id="bank" data-composition-src="compositions/bank.html" data-start="22.2" data-duration="7.3" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="factors" class="scene" data-composition-id="factors" data-composition-src="compositions/factors.html" data-start="29.5" data-duration="15.1" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="diff" class="scene" data-composition-id="diff" data-composition-src="compositions/diff.html" data-start="44.6" data-duration="5.06" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="cta" class="scene" data-composition-id="cta" data-composition-src="compositions/cta.html" data-start="49.66" data-duration="8.27" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>
      <div id="endcard" data-composition-id="endcard" data-composition-src="compositions/endcard.html" data-start="57.93" data-duration="3.07" data-track-index="3" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <div id="captions" data-composition-id="captions" data-composition-src="compositions/captions.html" data-start="0" data-duration="57.93" data-track-index="4" data-track-kind="captions" data-width="1080" data-height="1920"></div>
      <div id="chrome" data-composition-id="chrome" data-composition-src="compositions/chrome.html" data-start="0" data-duration="61" data-track-index="5" data-track-kind="graphics" data-width="1080" data-height="1920"></div>

      <!-- music bed (level envelope baked into the file: under voice, up on the end card) -->
      <audio id="bgm" class="clip" src="assets/music/bgm.wav" data-start="0" data-duration="61" data-track-index="6" data-volume="1" data-timeline-role="music"></audio>

      <!-- sound effects, one lane -->
      <audio id="sfx-hook-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="0" data-duration="2.1" data-track-index="7" data-volume="0.55"></audio>
      <audio id="sfx-badge" class="clip" src="assets/sfx/pop.mp3" data-start="2.11" data-duration="0.7" data-track-index="7" data-volume="0.6"></audio>
      <audio id="sfx-spec-in" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="4.8" data-duration="0.55" data-track-index="8" data-volume="0.5"></audio>
      <audio id="sfx-chip1" class="clip" src="assets/sfx/pop.mp3" data-start="4.95" data-duration="0.7" data-track-index="7" data-volume="0.45"></audio>
      <audio id="sfx-chip2" class="clip" src="assets/sfx/click-soft.mp3" data-start="5.8" data-duration="0.37" data-track-index="7" data-volume="0.7"></audio>
      <audio id="sfx-chip3" class="clip" src="assets/sfx/pop.mp3" data-start="6.98" data-duration="0.7" data-track-index="7" data-volume="0.45"></audio>
      <audio id="sfx-chip4" class="clip" src="assets/sfx/click-soft.mp3" data-start="7.74" data-duration="0.37" data-track-index="7" data-volume="0.7"></audio>
      <audio id="sfx-pip1" class="clip" src="assets/sfx/whoosh.mp3" data-start="8.4" data-duration="0.57" data-track-index="8" data-volume="0.5"></audio>
      <audio id="sfx-rate1" class="clip" src="assets/sfx/pop.mp3" data-start="10.5" data-duration="0.7" data-track-index="7" data-volume="0.55"></audio>
      <audio id="sfx-rate2" class="clip" src="assets/sfx/pop.mp3" data-start="12.6" data-duration="0.7" data-track-index="7" data-volume="0.55"></audio>
      <audio id="sfx-question" class="clip" src="assets/sfx/glitch-1.mp3" data-start="13.31" data-duration="1.3" data-media-start="0.5" data-track-index="8" data-volume="0.3" data-fade-out="0.4"></audio>
      <audio id="sfx-full1" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="14.85" data-duration="0.55" data-track-index="7" data-volume="0.5"></audio>
      <audio id="sfx-x1" class="clip" src="assets/sfx/error.mp3" data-start="17.78" data-duration="1.0" data-media-start="0.55" data-track-index="7" data-volume="0.32" data-fade-out="0.3"></audio>
      <audio id="sfx-x2" class="clip" src="assets/sfx/error.mp3" data-start="19.42" data-duration="1.0" data-media-start="0.55" data-track-index="7" data-volume="0.32" data-fade-out="0.3"></audio>
      <audio id="sfx-bank" class="clip" src="assets/sfx/sparkle.mp3" data-start="21.35" data-duration="1.4" data-track-index="7" data-volume="0.45" data-fade-out="0.4"></audio>
      <audio id="sfx-full2" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="22.05" data-duration="0.55" data-track-index="8" data-volume="0.5"></audio>
      <audio id="sfx-eval" class="clip" src="assets/sfx/pop.mp3" data-start="22.53" data-duration="0.7" data-track-index="7" data-volume="0.45"></audio>
      <audio id="sfx-riser" class="clip" src="assets/sfx/riser.mp3" data-start="25.04" data-duration="2.1" data-media-start="1.47" data-track-index="7" data-volume="0.4"></audio>
      <audio id="sfx-five" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="26.97" data-duration="2.1" data-track-index="8" data-volume="0.6"></audio>
      <audio id="sfx-pip3" class="clip" src="assets/sfx/whoosh.mp3" data-start="29.4" data-duration="0.57" data-track-index="7" data-volume="0.5"></audio>
      <audio id="sfx-f1" class="clip" src="assets/sfx/pop.mp3" data-start="30.4" data-duration="0.7" data-track-index="8" data-volume="0.5"></audio>
      <audio id="sfx-f2" class="clip" src="assets/sfx/click-soft.mp3" data-start="32.98" data-duration="0.37" data-track-index="7" data-volume="0.7"></audio>
      <audio id="sfx-f3" class="clip" src="assets/sfx/pop.mp3" data-start="36.78" data-duration="0.7" data-track-index="7" data-volume="0.5"></audio>
      <audio id="sfx-f4" class="clip" src="assets/sfx/click-soft.mp3" data-start="38.66" data-duration="0.37" data-track-index="7" data-volume="0.7"></audio>
      <audio id="sfx-f5" class="clip" src="assets/sfx/pop.mp3" data-start="40.9" data-duration="0.7" data-track-index="7" data-volume="0.5"></audio>
      <audio id="sfx-full3" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="44.55" data-duration="0.55" data-track-index="7" data-volume="0.5"></audio>
      <audio id="sfx-diff" class="clip" src="assets/sfx/pop.mp3" data-start="47.48" data-duration="0.7" data-track-index="7" data-volume="0.5"></audio>
      <audio id="sfx-cta" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="49.74" data-duration="0.55" data-track-index="7" data-volume="0.5"></audio>
      <audio id="sfx-form" class="clip" src="assets/sfx/notification.mp3" data-start="54.17" data-duration="1.4" data-track-index="7" data-volume="0.35" data-fade-out="0.4"></audio>
      <audio id="sfx-end-whoosh" class="clip" src="assets/sfx/whoosh.mp3" data-start="57.79" data-duration="0.57" data-track-index="7" data-volume="0.55"></audio>
      <audio id="sfx-end-hit" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="58.21" data-duration="2.1" data-track-index="8" data-volume="0.5"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const ORIGIN = "540px 690px";
      const FULL_CLIP = "inset(0px 0px 0px 0px round 0px)";
      const PIP_CLIP = "inset(380px 250px 920px 250px round 66px)";
      tl.set("#camwrap", { transformOrigin: ORIGIN, scale: 1.12, x: 0, y: 0 }, 0);
      tl.set("#camclip", { clipPath: FULL_CLIP }, 0);

      // slow ground drift so the backdrop never sits dead
      tl.fromTo("#bg-glow", { x: 0, y: 0 }, { x: 420, y: 520, duration: 61, ease: "none" }, 0);

      function pip(t) {
        tl.to("#camwrap", { scale: 0.6, x: 0, y: 400, duration: 0.55, ease: "power3.inOut" }, t);
        tl.to("#camclip", { clipPath: PIP_CLIP, duration: 0.55, ease: "power3.inOut" }, t);
        tl.to("#pipring", { opacity: 1, duration: 0.25, ease: "back.out(2)" }, t + 0.4);
      }
      function full(t, s = 1) {
        tl.to("#pipring", { opacity: 0, duration: 0.15, ease: "power2.in" }, t);
        tl.to("#camwrap", { scale: s, x: 0, y: 0, duration: 0.55, ease: "power3.inOut" }, t);
        tl.to("#camclip", { clipPath: FULL_CLIP, duration: 0.55, ease: "power3.inOut" }, t);
      }
      // hard punch-in / punch-out (a cut inside the shot)
      function punch(t, s) {
        tl.set("#camwrap", { scale: s }, t);
      }
      function push(t, s, d) {
        tl.to("#camwrap", { scale: s, duration: d, ease: "sine.inOut" }, t);
      }

      // HOOK: tight on the face, then open up
      push(0, 1.18, 3.35);
      punch(3.4, 1.0);
      push(3.44, 1.06, 4.8);
      pip(8.3); // panel: compare -> who
      full(21.95, 1.0);
      punch(23.56, 1.1);
      punch(26.25, 1.0);
      punch(27.02, 1.2);
      push(27.06, 1.1, 2.0);
      pip(29.3); // panel: 5 factors
      full(44.45, 1.0);
      punch(47.48, 1.15);
      punch(49.74, 1.0);
      push(49.76, 1.06, 4.4);
      punch(54.18, 1.14);
      push(54.2, 1.04, 3.6);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
