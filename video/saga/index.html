<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #f3f2ef;
        --ink: #1d2025;
        --gold: #be935b;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
      #ground {
        position: absolute;
        inset: 0;
        background-color: var(--ground);
        background-image:
          linear-gradient(rgba(29, 32, 37, 0.05) 1px, transparent 1px),
          linear-gradient(90deg, rgba(29, 32, 37, 0.05) 1px, transparent 1px);
        background-size: 90px 90px;
        background-position: 45px 0;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="59.95"
      data-width="1080"
      data-height="1920"
      data-fps="30"
    >
      <div id="ground"></div>

      <!-- Scenes (lane 1) -->
      <div id="hook" data-composition-id="hook" data-composition-src="compositions/hook.html"
        data-start="0" data-duration="5.5" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="engine" data-composition-id="engine" data-composition-src="compositions/engine.html"

        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="carplay" data-composition-id="carplay" data-composition-src="compositions/carplay.html"
        data-start="18.43" data-duration="11.25" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="gear" data-composition-id="gear" data-composition-src="compositions/gear.html"
        data-start="29.68" data-duration="11.95" data-track-index="1" data-track-kind="graphics"
        data-width="1080" data-height="1920" style="z-index: 2"></div>
      <div id="adas" data-composition-id="adas" data-composition-src="compositions/adas.html"

      <div id="logo" data-composition-id="logo" data-composition-src="compositions/logo.html"

        data-width="1080" data-height="1920" style="z-index: 2"></div>

      <!-- Fact counter overlay (lane 2) -->

        data-width="1080" data-height="1920" style="z-index: 5"></div>

      <!-- Voiceover (lane 3) -->
      <audio id="vo" class="clip" src="assets/audio/voiceover.wav" data-start="0.3"
        data-duration="55.78" data-track-index="3" data-volume="1"></audio>

      <!-- Music bed (lane 4): under the voice, opens up for the logo -->
      <audio id="music" class="clip" src="assets/audio/music.wav" data-start="0" data-duration="59.95"
        data-track-index="4" data-volume="1" data-fade-in="0.4" data-fade-out="1.4"
        data-automation='{"version":1,"lanes":[{"target":"volume","points":[{"t":0,"v":0.24},{"t":0.6,"v":0.16},{"t":55.65,"v":0.16},{"t":56.35,"v":0.5}]}]}'></audio>

    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;

  </body>
</html>
